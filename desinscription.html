/* Page de confirmation de la désinscription (fonction content-signup de mazeo-app, 30/09/2026). Jetons de mazeo.co. */
:root { --ink: #0A0A0A; --slate: #3A4250; --line-strong: #DDE1E9; --blue: #007BFF; --blue-deep: #0066D6; --green: #00EF8B;
  --font: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; --display: 'Bricolage Grotesque', var(--font); }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--slate); background: #fff; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }
.logo { font-family: 'Inter', var(--font); font-weight: 800; font-size: 26px; letter-spacing: -0.5px; color: var(--ink); text-decoration: none; }
.logo span { color: var(--green); }
h1 { margin: 96px 0 16px; font-family: var(--display); font-weight: 700; font-size: clamp(40px, 7vw, 64px); letter-spacing: -0.035em; line-height: 1; color: var(--ink); }
p { margin: 0; font-size: 19px; line-height: 1.55; max-width: 56ch; }
.ctas { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; padding: 12px 22px; border-radius: 9px; font-weight: 600; font-size: 15.5px; text-decoration: none; border: 1px solid transparent; }
.btn-primary { background: var(--blue); color: #fff; } .btn-primary:hover { background: var(--blue-deep); }
.btn-ghost { background: #fff; color: var(--ink); border-color: var(--line-strong); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
</style>
