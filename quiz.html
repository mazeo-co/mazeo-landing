<script>
(function () {
  var BANK = /*__BANK__*/[{"id":"focus-group","theme":2,"story":"focus","type":"choice","opening":true,"title":"Le focus group est né aux États-Unis dans les années 1940. À quoi servait-il, à l'origine ?","options":[{"name":"À tester des parfums de savon"},{"name":"À mesurer l'effet des émissions de propagande à la radio"},{"name":"À choisir le nom d'une automobile"},{"name":"À sélectionner des officiers"}],"answer":1,"right":31,"answerText":"À mesurer l'effet de la propagande radiophonique.","why":"En pleine Seconde Guerre mondiale, le sociologue Robert K. Merton réunit douze auditeurs dans un studio. Chacun presse un bouton vert ou un bouton rouge selon ce que l'émission lui inspire, puis le groupe en discute. L'expression « focus group » ne s'impose que dans les années 1950, sous l'influence d'Ernest Dichter.","src":"Robert K. Merton et Patricia L. Kendall, « The Focused Interview », American Journal of Sociology, vol. 51, n° 6, 1946.","en":{"title":"The focus group was born in the United States in the 1940s. What was it originally used for?","options":["Testing the scent of soap","Measuring the effect of radio propaganda broadcasts","Naming a car","Selecting army officers"],"answerText":"Measuring the effect of radio propaganda.","why":"In the middle of the Second World War, the sociologist Robert K. Merton gathered twelve listeners in a studio. Each pressed a green or a red button according to what the programme inspired, then the group discussed it. The term \"focus group\" only took hold in the 1950s, under the influence of Ernest Dichter."}},{"id":"gallup-belle-mere","theme":0,"story":"gallup","type":"choice","title":"En 1932, George Gallup réalise son tout premier sondage politique. Pour le compte de qui ?","options":[{"name":"Du président Herbert Hoover"},{"name":"Du New York Times"},{"name":"De sa belle-mère"},{"name":"De General Motors"}],"answer":2,"right":12,"answerText":"Pour sa belle-mère.","why":"Ola Babcock Miller brigue le poste de secrétaire d'État de l'Iowa, sans grande chance de l'emporter. Son gendre sonde les électeurs pour orienter sa campagne. Trois ans plus tard, en 1935, George Gallup fonde l'American Institute of Public Opinion, qui fera sa renommée dès l'élection présidentielle suivante.","src":"Gallup, Inc., biographie de George Gallup ; Susan Ohmer, George Gallup in Hollywood, Columbia University Press, 2006.","en":{"title":"In 1932, George Gallup carried out his very first political poll. On whose behalf?","options":["President Herbert Hoover","The New York Times","His mother-in-law","General Motors"],"answerText":"His mother-in-law.","why":"Ola Babcock Miller was running for Secretary of State of Iowa, with little chance of winning. Her son-in-law surveyed voters to steer her campaign. Three years later, in 1935, George Gallup founded the American Institute of Public Opinion, which made his name at the very next presidential election."}},{"id":"nielsen-ingenieur","theme":0,"story":"nielsen","type":"choice","title":"Quelle était la formation d'Arthur C. Nielsen, qui fonde en 1923 la société d'études portant son nom ?","options":[{"name":"Statisticien"},{"name":"Ingénieur électricien"},{"name":"Journaliste"},{"name":"Psychologue"}],"answer":1,"right":22,"answerText":"Ingénieur électricien.","why":"Diplômé de l'université du Wisconsin en 1918, Arthur C. Nielsen applique aux ventes la rigueur de la mesure industrielle. Dans les années 1930, ses enquêteurs relèvent les stocks et les achats des pharmacies américaines, puis des épiceries. Pour la première fois, une marque peut chiffrer sa part de marché face à ses concurrentes.","src":"Nielsen, « Celebrating Our History of Innovation », sites.nielsen.com.","en":{"title":"What was the training of Arthur C. Nielsen, who founded the research company bearing his name in 1923?","options":["Statistician","Electrical engineer","Journalist","Psychologist"],"answerText":"Electrical engineer.","why":"A graduate of the University of Wisconsin in 1918, Arthur C. Nielsen applied the rigour of industrial measurement to sales. In the 1930s his auditors recorded the stock and purchases of American drugstores, then grocery stores. For the first time, a brand could put a figure on its market share against its competitors."}},{"id":"starch","theme":0,"story":"starch","type":"choice","title":"En 1923, Daniel Starch, professeur à Harvard, fonde l'un des tout premiers cabinets d'études. Que mesure-t-il ?","options":[{"name":"L'audience de la radio"},{"name":"L'efficacité des annonces publicitaires"},{"name":"Les intentions de vote"},{"name":"Les prix en magasin"}],"answer":1,"right":44,"answerText":"L'efficacité des annonces publicitaires.","why":"Les enquêteurs de Daniel Starch and Staff présentent un magazine à ses lecteurs et relèvent les annonces qu'ils reconnaissent. Ce « test de Starch » est l'ancêtre des post-tests publicitaires. Le cabinet mesurera aussi l'audience de la radio, mais seulement à partir de 1928.","src":"Daniel Starch, Principles of Advertising, A. W. Shaw, 1923 ; Daniel Starch and Staff, fondé en 1923.","en":{"title":"In 1923, Daniel Starch, a professor at Harvard, founded one of the very first research firms. What did it measure?","options":["Radio audiences","The effectiveness of advertisements","Voting intentions","Prices in stores"],"answerText":"The effectiveness of advertisements.","why":"The interviewers of Daniel Starch and Staff showed a magazine to its readers and recorded the advertisements they recognised. This \"Starch test\" is the ancestor of advertising post-tests. The firm would go on to measure radio audiences too, but only from 1928."}},{"id":"nielsen-radio","theme":0,"story":"nielsen","type":"slider","unit":"annee","min":1900,"max":1980,"answer":1942,"tol":[1,5,10],"avg":1951,"title":"En quelle année Arthur C. Nielsen lance-t-il, aux États-Unis, son premier indice national d'audience de la radio ?","answerText":"En 1942.","why":"Le National Radio Index sert à la fois les stations et les annonceurs. La mesure de la télévision ne suit qu'en 1950. L'audience de la radio a donc été mesurée huit ans avant celle du petit écran.","src":"Nielsen, « Celebrating Our History of Innovation », sites.nielsen.com.","en":{"title":"In what year did Arthur C. Nielsen launch his first national radio audience index in the United States?","answerText":"In 1942.","why":"The National Radio Index served both stations and advertisers. Television measurement only followed in 1950. Radio audiences were therefore measured eight years before those of the small screen."}},{"id":"dichter-freud","theme":0,"story":"dichter","type":"choice","title":"Dans les années 1950, Ernest Dichter devient le « père des études de motivation ». À quelle discipline emprunte-t-il ses méthodes ?","options":[{"name":"La psychanalyse de Freud"},{"name":"La statistique de Fisher"},{"name":"La linguistique de Saussure"},{"name":"La sociologie de Durkheim"}],"answer":0,"right":58,"answerText":"À la psychanalyse de Freud.","why":"Né à Vienne en 1907, Ernest Dichter applique aux affaires les concepts et les techniques de la psychanalyse. Pour le savon Ivory, il établit que le bain comporte une part de sensualité. Pour Plymouth, que le cabriolet symbolise la liberté et que les épouses pèsent sur l'achat.","src":"Ernest Dichter, The Strategy of Desire, Doubleday, 1960.","en":{"title":"In the 1950s, Ernest Dichter became the \"father of motivational research\". From which discipline did he borrow his methods?","options":["Freud's psychoanalysis","Fisher's statistics","Saussure's linguistics","Durkheim's sociology"],"answerText":"Freud's psychoanalysis.","why":"Born in Vienna in 1907, Ernest Dichter applied the concepts and techniques of psychoanalysis to business. For Ivory soap, he established that bathing carries a hint of sensuality. For Plymouth, that the convertible symbolises freedom and that wives weigh on the purchase."}},{"id":"packard","theme":0,"story":"dichter","type":"choice","title":"Dans les années 1950, un best-seller américain accuse les études de motivation de manipuler les consommateurs. Quel est son titre ?","options":[{"name":"La Persuasion clandestine"},{"name":"No Logo"},{"name":"Propaganda"},{"name":"La Société du spectacle"}],"answer":0,"right":37,"answerText":"La Persuasion clandestine (The Hidden Persuaders), de Vance Packard.","why":"Le journaliste Vance Packard s'en prend aux méthodes d'Ernest Dichter, qu'il compare à l'univers de George Orwell. C'est la première crise de réputation du métier. Elle n'a pas freiné les études qualitatives : elle les a fait connaître du grand public.","src":"Vance Packard, The Hidden Persuaders, David McKay, 1957 (La Persuasion clandestine, Calmann-Lévy, 1958).","en":{"title":"In the 1950s, an American bestseller accused motivational research of manipulating consumers. What is its title?","options":["The Hidden Persuaders","No Logo","Propaganda","The Society of the Spectacle"],"answerText":"The Hidden Persuaders, by Vance Packard.","why":"The journalist Vance Packard attacked the methods of Ernest Dichter, which he compared to the world of George Orwell. It was the profession's first reputation crisis. It did not slow qualitative research down: it made it known to the general public."}},{"id":"ifop-munich","theme":0,"story":"ifop","type":"choice","title":"Sur quel sujet porte le premier sondage d'opinion publié en France, réalisé à l'automne 1938 ?","options":[{"name":"Les congés payés"},{"name":"Les accords de Munich"},{"name":"Le prix du pain"},{"name":"Le Tour de France"}],"answer":1,"right":35,"answerText":"Les accords de Munich.","why":"Le sociologue Jean Stoetzel mène cette enquête en octobre 1938, dans les semaines qui suivent la signature des accords : 57 % des Français les approuvent. Il fonde l'Ifop en décembre 1938. En France, le sondage naît donc politique, et non commercial.","src":"Ifop, Ifop Collectors n° 21, « 1938-1939 : l'opinion française à la veille de l'entrée en guerre », 2018 ; Jean-Christophe Marcel, « Le premier sondage d'opinion », Revue d'histoire des sciences humaines, 2002 ; Jean Stoetzel, Théorie des opinions, PUF, 1943.","en":{"title":"What was the subject of the first published opinion poll in France, carried out in the autumn of 1938?","options":["Paid holidays","The Munich Agreement","The price of bread","The Tour de France"],"answerText":"The Munich Agreement.","why":"The sociologist Jean Stoetzel ran this survey in October 1938, in the weeks after the agreement was signed: 57% of the French approved of it. He founded Ifop in December 1938. In France, polling was therefore born political, not commercial."}},{"id":"literary-digest","theme":1,"story":"digest","type":"choice","title":"En 1936, le magazine Literary Digest annonce la défaite de Franklin Roosevelt, sur la foi de 2,4 millions de réponses : le plus grand sondage jamais réalisé. Roosevelt est réélu triomphalement. Que devient le magazine ?","options":[{"name":"Il rachète l'institut de George Gallup"},{"name":"Il disparaît dix-huit mois plus tard"},{"name":"Il gagne son procès contre ses détracteurs"},{"name":"Il renonce aux sondages et prospère"}],"answer":1,"right":41,"answerText":"Il disparaît dix-huit mois plus tard.","why":"Le Literary Digest avait envoyé dix millions de bulletins. Il donnait Alf Landon vainqueur avec 57 % des voix ; Roosevelt l'emporte avec 61 %. La même année, George Gallup annonce le bon résultat avec 50 000 personnes. La leçon fonde le métier : la représentativité d'un échantillon compte davantage que sa taille.","src":"Peverill Squire, « Why the 1936 Literary Digest Poll Failed », Public Opinion Quarterly, vol. 52, n° 1, 1988.","en":{"title":"In 1936, the Literary Digest magazine announced the defeat of Franklin Roosevelt on the strength of 2.4 million replies, the largest poll ever conducted. Roosevelt was re-elected by a landslide. What became of the magazine?","options":["It bought George Gallup's institute","It disappeared eighteen months later","It won its lawsuit against its critics","It gave up polling and prospered"],"answerText":"It disappeared eighteen months later.","why":"The Literary Digest had mailed ten million ballots. It gave Alf Landon the win with 57% of the vote; Roosevelt won with 61%. The same year, George Gallup called the result correctly with 50,000 people. The lesson founded the profession: the representativeness of a sample matters more than its size."}},{"id":"gallup-50000","theme":1,"story":"digest","type":"choice","big":true,"title":"1936, élection présidentielle américaine : le Literary Digest se trompe de vainqueur avec 2,4 millions de réponses. George Gallup, lui, voit juste. Combien de personnes a-t-il interrogées ?","options":[{"name":"5 000"},{"name":"50 000"},{"name":"500 000"},{"name":"5 millions"}],"answer":1,"right":39,"answerText":"50 000 personnes, soit près de cinquante fois moins.","why":"George Gallup annonce la victoire de Franklin Roosevelt, que le magazine donnait battu. Son échantillon est petit, mais construit pour ressembler au pays. Celui du Literary Digest était immense, mais composé de volontaires plutôt aisés. Le sondage moderne est né de cette comparaison.","src":"Peverill Squire, « Why the 1936 Literary Digest Poll Failed », Public Opinion Quarterly, vol. 52, n° 1, 1988 ; David Freedman, Robert Pisani et Roger Purves, Statistics, W. W. Norton (pour les 50 000 personnes).","en":{"title":"1936, US presidential election: the Literary Digest picked the wrong winner with 2.4 million replies. George Gallup got it right. How many people did he interview?","options":["5,000","50,000","500,000","5 million"],"answerText":"50,000 people, almost fifty times fewer.","why":"George Gallup announced the victory of Franklin Roosevelt, whom the magazine had given as beaten. His sample was small, but built to resemble the country. The Literary Digest's was huge, but made up of rather well-off volunteers. Modern polling was born of that comparison."}},{"id":"new-coke-79","theme":1,"story":"newcoke","type":"slider","unit":"jours","min":0,"max":730,"answer":79,"tol":[8,25,60],"avg":212,"title":"Le 23 avril 1985, Coca-Cola remplace sa recette historique par le « New Coke », plébiscité lors des tests à l'aveugle. Au bout de combien de jours annonce-t-il le retour de l'ancienne formule ?","answerText":"Au bout de 79 jours.","why":"Le 11 juillet 1985, la direction annonce le retour de la recette d'origine. Les tests gustatifs étaient pourtant sans appel. Mais 10 à 12 % des personnes interrogées se disaient en colère à la seule idée du changement, et ce signal avait été écarté. On avait mesuré le goût, pas l'attachement à la marque.","src":"The Coca-Cola Company, histoire officielle de New Coke, coca-colacompany.com ; Mark Pendergrast, For God, Country and Coca-Cola, 1993.","en":{"title":"On 23 April 1985, Coca-Cola replaced its historic recipe with \"New Coke\", acclaimed in blind taste tests. After how many days did it announce the return of the old formula?","answerText":"After 79 days.","why":"On 11 July 1985, management announced the return of the original recipe. The taste tests had been unequivocal. But 10 to 12% of the people interviewed said they were angry at the mere idea of the change, and that signal had been set aside. Taste had been measured, not attachment to the brand."}},{"id":"new-coke-signal","theme":1,"story":"newcoke","type":"choice","title":"Avant de lancer le « New Coke » en 1985, Coca-Cola mène des tests à grande échelle. Quel signal, présent dans les résultats, la direction écarte-t-elle ?","options":[{"name":"Les moins de 25 ans préfèrent Pepsi"},{"name":"Le nouveau goût lasse après trois verres"},{"name":"10 à 12 % des testeurs se disent en colère à l'idée du changement"},{"name":"Les distributeurs refusent la nouvelle canette"}],"answer":2,"right":47,"answerText":"10 à 12 % des testeurs se disent en colère à l'idée du changement.","why":"Dans les réunions de groupe, ces consommateurs entraînaient même les autres participants. La nouvelle formule gagnait les tests de goût, mais l'attachement à la marque n'était pas mesuré. La recette d'origine revient 79 jours après le lancement.","src":"Mark Pendergrast, For God, Country and Coca-Cola, 1993 ; The Coca-Cola Company, coca-colacompany.com.","en":{"title":"Before launching \"New Coke\" in 1985, Coca-Cola ran large-scale tests. Which signal, present in the results, did management set aside?","options":["Under-25s prefer Pepsi","The new taste palls after three glasses","10 to 12% of testers said they were angry at the idea of the change","Distributors refused the new can"],"answerText":"10 to 12% of testers said they were angry at the idea of the change.","why":"In group sessions, these consumers even swayed the other participants. The new formula won the taste tests, but attachment to the brand was not measured. The original recipe came back 79 days after launch."}},{"id":"dewey-truman","theme":1,"story":"dewey","type":"choice","title":"3 novembre 1948 : le Chicago Daily Tribune titre « Dewey bat Truman ». C'est Harry Truman qui est élu. Quelle erreur George Gallup reconnaît-il ensuite ?","options":[{"name":"Un échantillon trop petit"},{"name":"Des questions mal formulées"},{"name":"Un terrain arrêté plusieurs semaines avant le vote"},{"name":"Des enquêteurs partisans"}],"answer":2,"right":33,"answerText":"Un terrain arrêté plusieurs semaines avant le vote.","why":"Certains de la victoire de Thomas Dewey, les instituts cessent d'interroger les électeurs bien avant le scrutin : le dernier terrain de Gallup s'achève le 25 octobre. Ils manquent la remontée de Harry Truman, qui l'emporte de 4,5 points. Le Tribune, contraint par une grève de boucler plus tôt qu'à l'ordinaire, avait déjà imprimé 150 000 exemplaires de sa une.","src":"Frederick Mosteller et al., The Pre-election Polls of 1948, Social Science Research Council, 1949 (reproduit par la Truman Library) ; Gallup, « George Gallup, Twentieth-Century Pioneer », news.gallup.com ; Chicago Tribune, 3 novembre 1948.","en":{"title":"3 November 1948: the Chicago Daily Tribune runs the headline \"Dewey Defeats Truman\". Harry Truman is the one elected. Which mistake did George Gallup later admit?","options":["Too small a sample","Badly worded questions","Fieldwork stopped several weeks before the vote","Partisan interviewers"],"answerText":"Fieldwork stopped several weeks before the vote.","why":"Certain of Thomas Dewey's victory, the pollsters stopped interviewing voters well before election day: Gallup's last fieldwork ended on 25 October. They missed Harry Truman's comeback, who won by 4.5 points. The Tribune, forced by a strike to go to press earlier than usual, had already printed 150,000 copies of its front page."}},{"id":"dewey-exemplaires","theme":1,"story":"dewey","type":"slider","unit":"exemplaires","min":0,"max":1000000,"step":10000,"answer":150000,"tol":[20000,60000,150000],"avg":340000,"title":"Novembre 1948 : combien d'exemplaires du Chicago Daily Tribune sortent des presses avec la une erronée « Dewey bat Truman », avant qu'elle ne soit corrigée ?","answerText":"Environ 150 000 exemplaires.","why":"Une grève oblige le journal à boucler plusieurs heures plus tôt qu'à l'ordinaire. La rédaction se fie aux sondages, unanimes à donner Thomas Dewey vainqueur. Harry Truman, élu, brandira cette une devant les photographes : l'image est restée le symbole des erreurs de sondage.","src":"Chicago Tribune, archives du 3 novembre 1948 ; Harry S. Truman Library.","en":{"title":"November 1948: how many copies of the Chicago Daily Tribune came off the presses with the erroneous headline \"Dewey Defeats Truman\" before it was corrected?","answerText":"About 150,000 copies.","why":"A strike forced the newspaper to go to press several hours earlier than usual. The newsroom relied on the polls, unanimous in giving Thomas Dewey the win. Harry Truman, elected, would brandish that front page before the photographers: the picture has remained the symbol of polling errors."}},{"id":"edsel","theme":1,"story":"edsel","type":"choice","title":"1957 : Ford lance une nouvelle marque automobile. Pour la nommer, son agence avance plus de 6 000 idées et la poétesse Marianne Moore propose « Utopian Turtletop ». Quel nom le conseil d'administration retient-il ?","options":[{"name":"Mustang"},{"name":"Edsel, le prénom du fils du fondateur"},{"name":"Thunderbird"},{"name":"Turtletop"}],"answer":1,"right":29,"answerText":"Edsel, contre l'avis des études.","why":"Le président du conseil impose ce prénom en l'absence d'Henry Ford II. La marque est lancée le 4 septembre 1957 et arrêtée en novembre 1959. Ford y perd entre 250 et 350 millions de dollars de l'époque, selon les estimations. L'Edsel reste le cas d'école d'une étude ignorée.","src":"John Brooks, « The Fate of the Edsel », The New Yorker, 26 novembre 1960.","en":{"title":"1957: Ford launches a new car brand. To name it, its agency puts forward more than 6,000 ideas and the poet Marianne Moore suggests \"Utopian Turtletop\". Which name does the board choose?","options":["Mustang","Edsel, the first name of the founder's son","Thunderbird","Turtletop"],"answerText":"Edsel, against the advice of the research.","why":"The chairman of the board imposed this first name in the absence of Henry Ford II. The brand was launched on 4 September 1957 and discontinued in November 1959. Ford lost between 250 and 350 million dollars of the time, depending on the estimate. The Edsel remains the textbook case of research ignored."}},{"id":"tropicana","theme":1,"story":"tropicana","type":"choice","big":true,"title":"En janvier 2009, Tropicana change l'emballage de son jus d'orange aux États-Unis. De combien ses ventes reculent-elles en moins de deux mois ?","options":[{"name":"2 %"},{"name":"5 %"},{"name":"20 %"},{"name":"50 %"}],"answer":2,"right":36,"answerText":"De 20 %.","why":"Le nouveau dessin, signé par l'agence Arnell, déroute les acheteurs, qui ne reconnaissent plus leur brique en rayon. Sept semaines plus tard, le 23 février, la marque annonce le retour à son ancien emballage. C'est devenu l'argument classique en faveur du test d'emballage.","src":"Stuart Elliott, « Tropicana Discovers Some Buyers Are Passionate About Packaging », The New York Times, 22 février 2009 ; Natalie Zmuda, « Tropicana Line's Sales Plunge 20% Post-Rebranding », Ad Age, 2 avril 2009.","en":{"title":"In January 2009, Tropicana changed the packaging of its orange juice in the United States. By how much did its sales fall in under two months?","options":["2%","5%","20%","50%"],"answerText":"By 20%.","why":"The new design, by the Arnell agency, confused shoppers, who no longer recognised their carton on the shelf. Seven weeks later, on 23 February, the brand announced a return to its former packaging. It has become the classic argument for packaging tests."}},{"id":"2002-ecart","theme":1,"story":"2002","type":"slider","unit":"voix","min":0,"max":2000000,"step":10000,"answer":194600,"tol":[25000,80000,200000],"avg":610000,"title":"En France, au premier tour de l'élection présidentielle du 21 avril 2002, combien de voix séparent Jean-Marie Le Pen de Lionel Jospin ?","answerText":"194 600 voix.","why":"Jean-Marie Le Pen obtient 16,86 % des suffrages, Lionel Jospin 16,18 %. Les derniers sondages publiés le situaient entre 12,5 et 14 %. Seize candidats se présentaient, un record, et l'écart final tient à moins d'un point. L'épisode a durablement marqué les instituts français.","src":"Conseil constitutionnel, proclamation des résultats du premier tour de l'élection présidentielle, avril 2002.","en":{"title":"In France, in the first round of the presidential election of 21 April 2002, how many votes separated Jean-Marie Le Pen from Lionel Jospin?","answerText":"194,600 votes.","why":"Jean-Marie Le Pen obtained 16.86% of the vote, Lionel Jospin 16.18%. The last published polls put him between 12.5 and 14%. Sixteen candidates stood, a record, and the final gap came to less than one point. The episode left a lasting mark on French polling firms."}},{"id":"2002-abstention","theme":1,"story":"2002","type":"choice","big":true,"title":"En France, quel est le taux d'abstention au premier tour de l'élection présidentielle du 21 avril 2002 ?","options":[{"name":"18,4 %"},{"name":"23,4 %"},{"name":"28,4 %"},{"name":"33,4 %"}],"answer":2,"right":34,"answerText":"28,4 %, soit 11,7 millions d'électeurs.","why":"Avec seize candidats et une abstention aussi élevée, quelques centaines de milliers de voix suffisent à changer l'ordre d'arrivée. Jean-Marie Le Pen devance Lionel Jospin de 194 600 voix. La participation s'est révélée aussi difficile à prévoir que les scores.","src":"Conseil constitutionnel, proclamation des résultats du premier tour de l'élection présidentielle, avril 2002.","en":{"title":"In France, what was the abstention rate in the first round of the presidential election of 21 April 2002?","options":["18.4%","23.4%","28.4%","33.4%"],"answerText":"28.4%, or 11.7 million voters.","why":"With sixteen candidates and such high abstention, a few hundred thousand votes are enough to change the order of finish. Jean-Marie Le Pen beat Lionel Jospin by 194,600 votes. Turnout proved as hard to predict as the scores."}},{"id":"brexit","theme":1,"story":"brexit","type":"choice","big":true,"title":"Au Royaume-Uni, quel score le « Leave » obtient-il au référendum de juin 2016 sur l'appartenance à l'Union européenne ?","options":[{"name":"50,4 %"},{"name":"51,9 %"},{"name":"53,6 %"},{"name":"55,2 %"}],"answer":1,"right":52,"answerText":"51,9 % des suffrages exprimés.","why":"17,4 millions de Britanniques votent pour la sortie, 16,1 millions pour le maintien, avec une participation de 72,2 %. Un résultat aussi serré se situe dans la marge d'erreur de la plupart des enquêtes. C'est moins l'erreur des instituts que la lecture de leurs chiffres qui a été mise en cause.","src":"The Electoral Commission, résultats du référendum du 23 juin 2016.","en":{"title":"In the United Kingdom, what share did \"Leave\" obtain in the June 2016 referendum on membership of the European Union?","options":["50.4%","51.9%","53.6%","55.2%"],"answerText":"51.9% of valid votes.","why":"17.4 million Britons voted to leave, 16.1 million to remain, on a turnout of 72.2%. A result this close sits within the margin of error of most surveys. It was less the pollsters' error than the reading of their figures that came under fire."}},{"id":"clinton-2016","theme":1,"story":"usa2016","type":"choice","title":"États-Unis, 2016 : à la veille du scrutin, les moyennes des sondages nationaux donnent à Hillary Clinton un peu plus de 3 points d'avance dans le vote populaire. Quel est l'écart réel ?","options":[{"name":"Donald Trump devant de 2 points"},{"name":"Égalité parfaite"},{"name":"Hillary Clinton devant de 2,1 points"},{"name":"Hillary Clinton devant de 6 points"}],"answer":2,"right":27,"answerText":"Hillary Clinton devant de 2,1 points.","why":"Elle recueille 48,2 % des voix, contre 46,1 % à Donald Trump. Les sondages nationaux ne se sont donc trompés que d'un point environ. Ils avaient annoncé le bon vainqueur du vote populaire ; l'élection s'est jouée ailleurs, dans le collège électoral.","src":"Federal Election Commission, Official 2016 Presidential General Election Results ; moyenne finale RealClearPolitics, 7 novembre 2016.","en":{"title":"United States, 2016: on the eve of the vote, the national polling averages gave Hillary Clinton a lead of just over 3 points in the popular vote. What was the real gap?","options":["Donald Trump ahead by 2 points","A dead heat","Hillary Clinton ahead by 2.1 points","Hillary Clinton ahead by 6 points"],"answerText":"Hillary Clinton ahead by 2.1 points.","why":"She won 48.2% of the vote, against 46.1% for Donald Trump. The national polls were therefore only about one point off. They had named the right winner of the popular vote; the election was decided elsewhere, in the Electoral College."}},{"id":"likert-annee","theme":2,"story":"likert","type":"slider","unit":"annee","min":1900,"max":2000,"answer":1932,"tol":[2,8,15],"avg":1957,"title":"« Pas du tout d'accord, plutôt pas d'accord… » : en quelle année Rensis Likert publie-t-il l'échelle qui porte son nom ?","answerText":"En 1932.","why":"Le psychologue américain la présente dans un article intitulé « A Technique for the Measurement of Attitudes », paru dans les Archives of Psychology. L'outil le plus utilisé des questionnaires a donc près d'un siècle. Il précède de quatre ans le premier grand succès de George Gallup.","src":"Rensis Likert, « A Technique for the Measurement of Attitudes », Archives of Psychology, n° 140, 1932.","en":{"title":"\"Strongly disagree, disagree…\": in what year did Rensis Likert publish the scale that bears his name?","answerText":"In 1932.","why":"The American psychologist presented it in an article entitled \"A Technique for the Measurement of Attitudes\", published in the Archives of Psychology. The most widely used tool in questionnaires is therefore almost a century old. It predates George Gallup's first great success by four years."}},{"id":"likert-prononciation","theme":2,"story":"likert","type":"choice","title":"Comment Rensis Likert, l'inventeur de l'échelle, prononçait-il son propre nom ?","options":[{"name":"« LAÏ-keurt », comme l'anglais like"},{"name":"« LIK-eurt », avec un i bref"},{"name":"« li-KÈRT », à la française"}],"answer":1,"right":24,"answerText":"« LIK-eurt », avec un i bref.","why":"La prononciation « LAÏ-keurt », de loin la plus répandue, est fautive. Le psychologue américain prononçait la première syllabe comme dans le mot anglais lick. Presque toute la profession écorche donc le nom de son outil le plus courant.","src":"Patty Kero et Daniel Lee, « Likert is Pronounced “LICK-urt” not “LIE-kurt”… », Journal of Applied Measurement, vol. 17, n° 4, 2016 ; Earl Babbie, The Basics of Social Research, 2005 ; Wikipédia (EN), « Likert scale ».","en":{"title":"How did Rensis Likert, the inventor of the scale, pronounce his own name?","options":["\"LIE-kurt\", like the English word like","\"LICK-urt\", with a short i","\"lee-KAIR\", the French way"],"answerText":"\"LICK-urt\", with a short i.","why":"The pronunciation \"LIE-kurt\", by far the most common, is wrong. The American psychologist pronounced the first syllable like the English word lick. Almost the whole profession therefore mangles the name of its most common tool."}},{"id":"courtyard","theme":2,"story":"conjoint","type":"choice","title":"Au début des années 1980, une chaîne d'hôtels est conçue de bout en bout grâce à une analyse conjointe, menée par Paul Green et Jerry Wind. Laquelle ?","options":[{"name":"Courtyard by Marriott"},{"name":"Ibis"},{"name":"Holiday Inn Express"},{"name":"Formule 1"}],"answer":0,"right":30,"answerText":"Courtyard by Marriott.","why":"Marriott commande aux deux professeurs de Wharton une vaste étude auprès de voyageurs d'affaires et de loisirs. Chaque attribut de l'hôtel est arbitré par l'analyse conjointe, de la taille des chambres aux services. La chaîne passe de trois hôtels en 1983 à environ 450 en 2000, et dépasse aujourd'hui les 1 300 dans le monde.","src":"Jerry Wind, Paul E. Green, Douglas Shifflet et Marsha Scarbrough, « Courtyard by Marriott: Designing a Hotel Facility with Consumer-Based Marketing Models », Interfaces, vol. 19, n° 1, 1989.","en":{"title":"In the early 1980s, a hotel chain was designed from end to end using conjoint analysis, led by Paul Green and Jerry Wind. Which one?","options":["Courtyard by Marriott","Ibis","Holiday Inn Express","Formule 1"],"answerText":"Courtyard by Marriott.","why":"Marriott commissioned the two Wharton professors to run a large study of business and leisure travellers. Every attribute of the hotel was decided by conjoint analysis, from room size to services. The chain grew from three hotels in 1983 to about 450 in 2000, and now has more than 1,300 worldwide."}},{"id":"nps-annee","theme":2,"story":"nps","type":"slider","unit":"annee","min":1950,"max":2020,"answer":2003,"tol":[1,4,8],"avg":1994,"title":"En quelle année le Net Promoter Score a-t-il vu le jour ?","answerText":"En 2003.","why":"Fred Reichheld, consultant chez Bain & Company, le présente dans la Harvard Business Review sous le titre « The One Number You Need to Grow ». L'indicateur le plus répandu de la relation client a donc à peine plus de vingt ans.","src":"Fred Reichheld, « The One Number You Need to Grow », Harvard Business Review, décembre 2003.","en":{"title":"In what year was the Net Promoter Score born?","answerText":"In 2003.","why":"Fred Reichheld, a consultant at Bain & Company, presented it in the Harvard Business Review under the title \"The One Number You Need to Grow\". The most widespread indicator of customer relations is therefore barely more than twenty years old."}},{"id":"nps-critique","theme":2,"story":"nps","type":"choice","title":"Le Net Promoter Score repose sur une seule question : « Recommanderiez-vous… ? ». Que conclut une étude longitudinale publiée en 2007 à son sujet ?","options":[{"name":"Il prédit la croissance deux fois mieux que la satisfaction"},{"name":"Elle ne prédit pas mieux la croissance que les questions classiques de satisfaction et de fidélité"},{"name":"Il ne fonctionne qu'aux États-Unis"},{"name":"Il faudrait onze questions pour le fiabiliser"}],"answer":1,"right":42,"answerText":"Elle ne prédit pas mieux la croissance que les questions classiques de satisfaction et de fidélité.","why":"Sur 21 entreprises norvégiennes suivies plusieurs années, la question de recommandation ne prédit pas mieux la croissance que la satisfaction globale, l'intention de rachat ou l'indice ACSI. Le succès du NPS tient donc moins à son pouvoir de prédiction qu'à sa simplicité : un seul chiffre, que toute une entreprise comprend.","src":"Timothy Keiningham, Bruce Cooil, Tor Andreassen et Lerzan Aksoy, « A Longitudinal Examination of Net Promoter and Firm Revenue Growth », Journal of Marketing, vol. 71, n° 3, 2007.","en":{"title":"The Net Promoter Score rests on a single question: \"Would you recommend…?\". What did a longitudinal study published in 2007 conclude about it?","options":["It predicts growth twice as well as satisfaction","It predicts growth no better than the classic satisfaction and loyalty questions","It only works in the United States","Eleven questions would be needed to make it reliable"],"answerText":"It predicts growth no better than the classic satisfaction and loyalty questions.","why":"Across 21 Norwegian companies followed over several years, the recommendation question predicted growth no better than overall satisfaction, repurchase intention or the ACSI index. The success of the NPS therefore owes less to its predictive power than to its simplicity: a single number that a whole company understands."}},{"id":"marge-erreur","theme":2,"story":"marge","type":"choice","big":true,"title":"Un sondage aléatoire est mené auprès de 1 000 personnes. Quelle est sa marge d'erreur, au niveau de confiance habituel de 95 % ?","options":[{"name":"± 1 point"},{"name":"± 3 points"},{"name":"± 5 points"},{"name":"± 10 points"}],"answer":1,"right":61,"answerText":"Environ ± 3 points.","why":"La règle de calcul tient en une ligne : 0,98 divisé par la racine carrée de la taille de l'échantillon. Pour quadrupler la précision, il faut donc seize fois plus de répondants. En France, les sondages électoraux reposent sur la méthode des quotas, pour laquelle cette marge ne se calcule pas en toute rigueur.","src":"Intervalle de confiance à 95 % d'une proportion : ± 1,96 × √(p(1 − p)/n). Pour n = 1 000 et p = 0,5 : ± 3,1 points.","en":{"title":"A random survey is conducted among 1,000 people. What is its margin of error, at the usual 95% confidence level?","options":["± 1 point","± 3 points","± 5 points","± 10 points"],"answerText":"About ± 3 points.","why":"The rule of thumb fits on one line: 0.98 divided by the square root of the sample size. To quadruple precision, you therefore need sixteen times more respondents. In France, election polls rely on the quota method, for which this margin cannot be calculated rigorously."}},{"id":"bva","theme":3,"story":"bva","type":"choice","title":"Que signifient les trois lettres de BVA, institut d'études fondé en France en 1970 ?","options":[{"name":"Bureau de vérification des audiences"},{"name":"Brulé Ville Associés"},{"name":"Baromètres, ventes, analyses"},{"name":"Bureau de la valeur ajoutée"}],"answer":1,"right":26,"answerText":"Brulé Ville Associés.","why":"Michel Brulé et Jean-Pierre Ville sont collègues à l'Ifop lorsqu'ils décident de fonder leur propre institut. Le sigle n'a donc rien de technique : ce sont deux noms propres. L'histoire se répète souvent dans le secteur, où beaucoup d'instituts sont nés du départ de deux associés.","src":"Larousse, encyclopédie en ligne, « BVA » ; BVA, historique du groupe.","en":{"title":"What do the three letters of BVA stand for, a research institute founded in France in 1970?","options":["Bureau de vérification des audiences","Brulé Ville Associés","Baromètres, ventes, analyses","Bureau de la valeur ajoutée"],"answerText":"Brulé Ville Associés.","why":"Michel Brulé and Jean-Pierre Ville were colleagues at Ifop when they decided to found their own institute. The acronym is therefore nothing technical: it is two surnames. The story often repeats itself in the sector, where many institutes were born from the departure of two partners."}},{"id":"loi-1977","theme":3,"story":"loi","type":"choice","title":"En France, jusqu'en 2002, combien de temps avant un scrutin la publication des sondages électoraux était-elle interdite ?","options":[{"name":"Vingt-quatre heures"},{"name":"Quarante-huit heures"},{"name":"Une semaine"},{"name":"Un mois"}],"answer":2,"right":38,"answerText":"Une semaine.","why":"La loi du 19 juillet 1977, qui crée aussi la Commission des sondages, interdisait toute publication pendant la semaine précédant le vote. La réforme de février 2002 ramène l'interdiction à la veille et au jour du scrutin. Y contrevenir expose à une amende de 75 000 euros.","src":"Loi n° 77-808 du 19 juillet 1977, articles 11 et 12 (Légifrance) ; loi n° 2002-214 du 19 février 2002.","en":{"title":"In France, until 2002, how long before an election was the publication of electoral polls banned?","options":["Twenty-four hours","Forty-eight hours","One week","One month"],"answerText":"One week.","why":"The law of 19 July 1977, which also created the Commission des sondages, banned all publication during the week before the vote. The reform of February 2002 reduced the ban to the eve and the day of the election. Breaking it carries a fine of 75,000 euros."}},{"id":"ipsos-1975","theme":3,"story":"ipsos","type":"slider","unit":"annee","min":1930,"max":2000,"answer":1975,"tol":[1,5,10],"avg":1968,"title":"En quelle année Didier Truchot fonde-t-il Ipsos, à Paris ?","answerText":"En 1975.","why":"Jean-Marc Lech le rejoint en 1982. Le groupe entre à la Bourse de Paris en 1999, puis rachète Synovate en 2011, ce qui le porte au troisième rang mondial des études. C'est aujourd'hui le seul institut français de cette taille.","src":"Ipsos, « Notre histoire », ipsos.com.","en":{"title":"In what year did Didier Truchot found Ipsos, in Paris?","answerText":"In 1975.","why":"Jean-Marc Lech joined him in 1982. The group was listed on the Paris stock exchange in 1999, then acquired Synovate in 2011, which took it to third place worldwide in research. It is today the only French institute of that size."}},{"id":"csa","theme":3,"story":"csa","type":"choice","title":"Que signifiait, à l'origine, le sigle CSA, institut d'études français fondé en 1983 par Claude Suquet ?","options":[{"name":"Centre de statistiques appliquées"},{"name":"Conseil sondages analyses"},{"name":"Consommateurs, sociétés, audiences"},{"name":"Comité de suivi des audiences"}],"answer":1,"right":21,"answerText":"Conseil sondages analyses.","why":"Claude Suquet est vite rejointe par le politologue Roland Cayrol. Le groupe Bolloré entre au capital en 2006 et en devient l'unique actionnaire en 2008. Depuis octobre 2015, l'institut est une filiale de Havas, et le sigle se lit désormais Consumer Science & Analytics.","src":"Bolloré, communiqué du 10 juillet 2008 ; Havas, communiqué du 2 octobre 2015 ; csa.eu, « Consumer Science & Analytics : une nouvelle signature pour CSA », 2016 ; Wikipédia (FR), « Institut CSA ».","en":{"title":"What did the acronym CSA originally stand for, the French research institute founded in 1983 by Claude Suquet?","options":["Centre de statistiques appliquées","Conseil sondages analyses","Consommateurs, sociétés, audiences","Comité de suivi des audiences"],"answerText":"Conseil sondages analyses.","why":"Claude Suquet was soon joined by the political scientist Roland Cayrol. The Bolloré group took a stake in 2006 and became sole shareholder in 2008. Since October 2015 the institute has been a Havas subsidiary, and the acronym now reads Consumer Science & Analytics."}},{"id":"gfk-erhard","theme":3,"story":"gfk","type":"choice","title":"L'institut allemand GfK est fondé à Nuremberg en 1934 par des universitaires. Que deviendra l'un d'eux, Ludwig Erhard ?","options":[{"name":"Chancelier de la République fédérale d'Allemagne"},{"name":"Prix Nobel de physique"},{"name":"Président de la Bundesbank"},{"name":"Président de Volkswagen"}],"answer":0,"right":33,"answerText":"Chancelier de la République fédérale d'Allemagne.","why":"Ministre de l'Économie puis chancelier, Ludwig Erhard est le père du « miracle économique » allemand. L'institut qu'il a cofondé a été racheté en juillet 2023 par l'américain NIQ. Bruxelles a imposé en contrepartie la cession de son panel de consommateurs, repris par le britannique YouGov.","src":"GfK, historique du groupe, gfk.com ; Commission européenne, autorisation de l'acquisition de GfK par NIQ, juillet 2023.","en":{"title":"The German institute GfK was founded in Nuremberg in 1934 by academics. What would one of them, Ludwig Erhard, become?","options":["Chancellor of the Federal Republic of Germany","Nobel laureate in physics","President of the Bundesbank","Chairman of Volkswagen"],"answerText":"Chancellor of the Federal Republic of Germany.","why":"Minister of the Economy and then Chancellor, Ludwig Erhard is the father of the German \"economic miracle\". The institute he co-founded was bought in July 2023 by America's NIQ. Brussels required, in return, the sale of its consumer panel, which went to Britain's YouGov."}},{"id":"esomar-e","theme":3,"story":"esomar","type":"choice","title":"Que signifiait, à sa création en 1947, le « E » d'ESOMAR ?","options":[{"name":"European"},{"name":"Ethical"},{"name":"Economic"},{"name":"Expert"}],"answer":0,"right":49,"answerText":"European : European Society for Opinion and Marketing Research.","why":"L'association, installée à Amsterdam, réunit aujourd'hui des membres dans plus de 130 pays. Elle publie depuis 1977, avec la Chambre de commerce internationale, le code de conduite de la profession. Sa dernière révision, en 2025, intègre l'intelligence artificielle.","src":"ESOMAR, « About ESOMAR », esomar.org ; Code international ICC/ESOMAR, éditions 1977 et 2025.","en":{"title":"When it was created in 1947, what did the \"E\" of ESOMAR stand for?","options":["European","Ethical","Economic","Expert"],"answerText":"European: European Society for Opinion and Marketing Research.","why":"The association, based in Amsterdam, today has members in more than 130 countries. Since 1977 it has published, with the International Chamber of Commerce, the profession's code of conduct. Its latest revision, in 2025, covers artificial intelligence."}},{"id":"kantar-bain","theme":3,"story":"kantar","type":"slider","unit":"mdusd","min":0,"max":20,"step":0.5,"answer":4,"tol":[0.5,1.5,3],"avg":7.5,"title":"En 2019, WPP cède 60 % de Kantar au fonds Bain Capital. Sur quelle valorisation totale de l'entreprise, en milliards de dollars ?","answerText":"4 milliards de dollars.","why":"WPP en retire environ 3,1 milliards de dollars nets. Kantar était née en 1992 comme la division études de WPP, et avait absorbé en 2008 TNS, héritière de la Sofres. C'est l'une des plus grosses transactions de l'histoire du secteur.","src":"WPP, communiqué du 12 juillet 2019 : cession de 60 % de Kantar à Bain Capital.","en":{"title":"In 2019, WPP sold 60% of Kantar to the fund Bain Capital. At what total valuation of the company, in billions of dollars?","answerText":"4 billion dollars.","why":"WPP netted about 3.1 billion dollars from the sale. Kantar had been born in 1992 as WPP's research division, and had absorbed TNS, heir to Sofres, in 2008. It is one of the biggest transactions in the sector's history."}},{"id":"sondages-293","theme":3,"story":"inflation","type":"slider","unit":"sondages","min":100,"max":1000,"step":1,"answer":293,"tol":[25,70,150],"avg":410,"title":"En France, 111 sondages sont publiés pendant la campagne présidentielle de 1981. Combien le sont pendant celle de 2007 ?","answerText":"293 sondages.","why":"Le nombre a presque triplé en vingt-six ans, puis a encore presque doublé : 560 sondages en 2017, 467 en 2022. La Commission des sondages, créée par la loi de 1977, contrôle chacun d'eux. Jamais le métier n'a été aussi visible, ni aussi discuté.","src":"Commission des sondages, rapports d'activité ; Alain Garrigou, L'Ivresse des sondages, La Découverte, 2006.","en":{"title":"In France, 111 polls were published during the 1981 presidential campaign. How many were published during the 2007 campaign?","answerText":"293 polls.","why":"The number almost tripled in twenty-six years, then almost doubled again: 560 polls in 2017, 467 in 2022. The Commission des sondages, created by the 1977 law, checks every one of them. Never has the trade been so visible, nor so debated."}},{"id":"mediamat","theme":4,"story":"mediamat","type":"slider","unit":"personnes","min":0,"max":200000,"step":500,"answer":12000,"tol":[1500,5000,12000],"avg":48000,"title":"En France, l'audience de la télévision, sur laquelle s'achète la publicité télévisée, est mesurée auprès d'un panel : le Médiamat. Combien de personnes le composent ?","answerText":"Près de 12 000 personnes.","why":"Elles sont âgées de quatre ans et plus et réparties dans 5 500 foyers, dont 5 000 équipés d'un téléviseur relié à un audimètre de Médiamétrie ; un second panel de 5 000 personnes mesure l'écoute hors du domicile. Le capital de la société est partagé entre les chaînes, les radios, les annonceurs et leurs agences, sans qu'aucun ne détienne la majorité : c'est la condition de sa neutralité.","src":"Médiamétrie, note méthodologique du Médiamat (mediametrie.fr, résultats hebdomadaires) ; Médiamétrie, « Le capital de Médiamétrie ».","en":{"title":"In France, television audiences, on which TV advertising is bought, are measured through a panel: the Médiamat. How many people make it up?","answerText":"Nearly 12,000 people.","why":"They are aged four and over and spread across 5,500 households, 5,000 of them with a television set connected to a Médiamétrie meter; a second panel of 5,000 people measures viewing outside the home. The company's capital is shared between broadcasters, radio stations, advertisers and their agencies, with none holding a majority: that is the condition of its neutrality."}},{"id":"audimat-600","theme":4,"story":"audimat","type":"slider","unit":"foyers","min":0,"max":10000,"step":50,"answer":600,"tol":[100,300,800],"avg":2300,"title":"En France, combien de foyers sont équipés du tout premier Audimat, lancé en 1981 ?","answerText":"600 foyers.","why":"L'appareil mesure alors l'écoute du foyer, et non celle de chaque personne. À la fin des années 1980, un panel élargi et une mesure individuelle lui succèdent sous le nom de Médiamat. Le mot « audimat », lui, est resté dans la langue courante.","src":"Cécile Méadel, Quantifier le public, Economica, 2010 (recension sur nonfiction.fr) ; Philippe Tassi (Médiamétrie), Journal de la Société de statistique de Paris, 1993.","en":{"title":"In France, how many households were equipped with the very first Audimat, launched in 1981?","answerText":"600 households.","why":"The device then measured the household's viewing, not each person's. At the end of the 1980s, a larger panel and individual measurement succeeded it under the name Médiamat. The word \"audimat\" itself has stayed in everyday French."}},{"id":"126000","theme":4,"story":"radio","type":"choice","title":"En France, l'enquête de référence sur l'audience de la radio s'est longtemps appelée « la 126 000 ». D'où venait ce nombre ?","options":[{"name":"Du nombre de personnes interrogées chaque année"},{"name":"Du nombre de stations mesurées"},{"name":"De son prix, en francs"},{"name":"Du numéro du décret qui l'a créée"}],"answer":0,"right":55,"answerText":"Du nombre de personnes interrogées chaque année.","why":"L'enquête est née en 1986 : chaque année, Médiamétrie interroge par téléphone 126 000 personnes sur leur écoute de la veille. Depuis septembre 2021, elle porte le nom d'EAR, pour Étude Audience Radio.","src":"INA, La Revue des médias, « Comment mesure-t-on l'audience de la radio ? » ; Médiamétrie, « EAR, l'Étude Audience Radio », septembre 2021.","en":{"title":"In France, the reference survey on radio audiences was long called \"the 126 000\". Where did that number come from?","options":["The number of people interviewed each year","The number of stations measured","Its price, in francs","The number of the decree that created it"],"answerText":"The number of people interviewed each year.","why":"The survey was born in 1986: every year, Médiamétrie interviews 126,000 people by telephone about the previous day's listening. Since September 2021 it has been called EAR, for Étude Audience Radio."}},{"id":"marche-mondial","theme":4,"story":"marche","type":"slider","unit":"mdusd","min":0,"max":450,"step":1,"answer":153,"tol":[15,38,76],"avg":92,"title":"À combien s'élève, en milliards de dollars, le chiffre d'affaires mondial du secteur des études et de l'insight en 2024 ?","answerText":"153 milliards de dollars, en hausse de 8 % sur un an.","why":"Les logiciels d'études génèrent 62 milliards de dollars, les études de marché au sens strict 56 milliards, les rapports sectoriels et le conseil 35 milliards. Les logiciels pèsent donc désormais davantage que les études elles-mêmes, et croissent plus de deux fois plus vite.","src":"ESOMAR, Global Market Research 2025, page publique du rapport (esomar.org) ; Research World, « Inside the $153bn insights industry », novembre 2025.","en":{"title":"How much, in billions of dollars, was the worldwide turnover of the research and insights sector in 2024?","answerText":"153 billion dollars, up 8% in one year.","why":"Research software generates 62 billion dollars, market research in the strict sense 56 billion, sector reports and consulting 35 billion. Software therefore now weighs more than research itself, and grows more than twice as fast."}},{"id":"sub-duree","sub":true,"type":"slider","unit":"mois","min":0,"max":96,"answer":21,"tol":[2,6,12],"avg":38,"title":"En France, chez un annonceur, combien de temps une même personne occupe-t-elle un poste études ou insights, en durée médiane ?","answerText":"21 mois, soit moins de deux ans.","why":"Près de six postes sur dix sont occupés deux ans ou moins. Moins d'un poste sur cinq l'est pendant quatre ans ou plus. Pour un institut, un portefeuille de clients se renouvelle donc plus vite qu'un contrat-cadre.","src":"1 481 postes études et insights occupés chez des annonceurs et terminés depuis 2016, hors stages et alternances. Base mazeo, septembre 2026.","side":"mazeo vous permet d'être prévenu de <b>chaque prise de poste, chaque promotion et chaque changement d'entreprise<\/b> chez les annonceurs que vous suivez, pour reprendre contact au bon moment.","en":{"title":"In France, at an advertiser, how long does one person hold a research or insights position, in median duration?","answerText":"21 months, less than two years.","why":"Nearly six positions in ten are held for two years or less. Fewer than one in five is held for four years or more. For an institute, a client portfolio therefore turns over faster than a framework contract.","src":"1,481 research and insights positions held at advertisers and ended since 2016, excluding internships and apprenticeships. mazeo database, September 2026.","side":"mazeo lets you know about <b>every new appointment, every promotion and every change of company<\/b> among the advertisers you follow, so you get back in touch at the right moment."}},{"id":"sub-nouveaux","sub":true,"type":"slider","unit":"sur100","min":0,"max":100,"answer":13,"tol":[2,5,10],"avg":24,"title":"En France, sur 100 personnes en poste dans les études ou les insights chez un annonceur, combien occupent ce poste depuis moins d'un an ?","answerText":"13 sur 100.","why":"Parmi ces nouveaux venus, six sur dix arrivent d'une autre entreprise ; les quatre autres ont évolué au sein de la leur. Chaque année, un interlocuteur sur huit est donc à rencontrer pour la première fois, ou à redécouvrir dans un nouveau périmètre.","src":"1 479 personnes dont l'intitulé de poste mentionne les études ou les insights, chez 655 annonceurs. Base mazeo, septembre 2026.","side":"mazeo vous permet de repérer, chez chaque annonceur, <b>les personnes qui viennent de prendre leur poste<\/b> : celles qui ont un budget à bâtir et des partenaires à choisir.","en":{"title":"In France, out of 100 people in a research or insights position at an advertiser, how many have held that position for less than a year?","answerText":"13 out of 100.","why":"Among these newcomers, six in ten come from another company; the other four moved within their own. Every year, one contact in eight is therefore to be met for the first time, or rediscovered in a new role.","src":"1,479 people whose job title mentions research or insights, at 655 advertisers. mazeo database, September 2026.","side":"mazeo lets you spot, at every advertiser, <b>the people who have just taken up their position<\/b>: those with a budget to build and partners to choose."}}];

          return el("div", { class: "slot" }, [el("span", { class: "num", text: String(k + 1) }), el("div", { class: "drop" + (name ? " filled" : ""), "data-zone": String(k) }, [name ? card(name) : null])]); }))])

  }
  function ready(q) { if (q.type === "slider") return state.touched; if (q.type === "choice") return state.pending !== null; return state.pending && state.pending.indexOf(null) < 0; }

  function questionScreen(q) {

  /* Publication du score (23/09/2026) : la fonction waitlist-signup ne connaît que l'email, la société et la langue.

  function publishScore() {
    var btn = document.getElementById("gate-btn"), msg = document.getElementById("gate-msg");

    var consent = document.getElementById("f-consent"), news = !consent || consent.checked;

      .catch(function () { btn.disabled = false; msg.textContent = t("sendErr"); msg.className = "note err"; });
  }

  function viewResult() {
    var tt = total(), li = tt >= 75 ? 0 : tt >= 50 ? 1 : tt >= 25 ? 2 : 3, label = t("labels")[li];
    var line = t("lines")[tt >= 75 ? 0 : tt >= 45 ? 1 : 2];
