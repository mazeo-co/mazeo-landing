<style>
/* Un seul univers, du début à la fin : le plateau de nuit. Le vert mazeo sert de lumière. */
:root {
  color-scheme: dark;
  --ground: #06080C; --card: #0D1119; --soft: #121826;
  --ink: #F5F7FB; --slate: #CBD2DE; --body: #AEB7C6; --meta: #8A94A6;
  --line: #1F2635; --line-strong: #2C3548; --line-soft: #171D2A;
  --blue: #2B8FFF; --blue-deep: #1F7DEB; --blue-text: #7DBBFF; --blue-tint: rgba(43,143,255,.16);
  --green: #00EF8B; --green-tint: rgba(0,239,139,.13); --green-text: #00EF8B;
  --red: #FF5C5C; --red-tint: rgba(255,92,92,.14); --red-text: #FF8F8F;
  --amber: #FFC24B; --amber-tint: rgba(255,194,75,.13); --amber-text: #FFC24B;
  --font: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --title: 'Bricolage Grotesque', var(--font);
  --show: 'Big Shoulders Display', 'Arial Narrow', var(--font);
  --logo-font: 'Inter', var(--font);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--body); font-family: var(--font); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  background: radial-gradient(ellipse 90% 55% at 50% -8%, rgba(43,143,255,.20), transparent 62%), radial-gradient(ellipse 50% 40% at 50% 108%, rgba(0,239,139,.08), transparent 70%), var(--ground); background-attachment: fixed; }
h1, h2 { margin: 0; color: var(--ink); font-family: var(--title); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
#confetti, #flash { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
#flash { z-index: 49; background: var(--red); opacity: 0; }

.shell { min-height: 100%; display: flex; flex-direction: column; padding-inline: 24px; }
.foot-page { width: 100%; max-width: 1180px; margin-inline: auto; padding-block: 18px 28px; border-top: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.foot-page .mz { font-size: 20px; }
.foot-page .base { font-size: 13.5px; color: var(--meta); }
.foot-page .site { margin-left: auto; font-size: 13.5px; color: var(--meta); text-decoration: none; }
.foot-page .site:hover { color: var(--ink); }
.strip { border-bottom: 1px solid var(--line); }
.strip-in { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; max-width: 1180px; margin-inline: auto; padding-block: 8px; flex-wrap: wrap; }
.strip .who { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.strip .who .base { font-size: 13px; color: var(--meta); }
@media (max-width: 700px) { .strip .who .base { display: none; } }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; max-width: 1180px; margin-inline: auto; padding-block: 18px 6px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .name { font-family: var(--show); font-weight: 900; font-size: 34px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink); line-height: 1.15; }
.brand .name a { color: inherit; text-decoration: none; }
.brand .name em { font-style: normal; color: var(--green); }
.by { font-size: 12.5px; color: var(--meta); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.mzblock { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-left: 10px; padding-left: 18px; border-left: 1px solid var(--line-strong); }
.mzblock .mz { font-size: 22px; }
.mzblock .base { font-size: 12px; color: var(--meta); white-space: nowrap; }
@media (max-width: 760px) { .mzblock .base { display: none; } }
a.mz, a.mz:hover { text-decoration: none; }
.mz { font-family: var(--logo-font); font-weight: 800; letter-spacing: -0.4px; color: var(--ink); font-size: 15px; }
.mz span { color: var(--green); }
.bar-right { display: flex; align-items: center; gap: 10px; }
.tag { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-text); background: var(--amber-tint); border-radius: 100px; padding: 5px 10px; white-space: nowrap; }
.pill-btn { border: 1px solid var(--line-strong); background: var(--card); color: var(--slate); border-radius: 100px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.pill-btn[aria-pressed="true"] { color: var(--green-text); border-color: var(--green); }
.langs { display: flex; gap: 6px; }
.lang { display: inline-flex; align-items: center; height: 34px; border-radius: 100px; border: 1px solid var(--line-strong); background: var(--card); padding: 3px 5px; cursor: pointer; }
.lang .flag { width: 30px; height: 20px; }

.share { position: relative; }
.share-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; min-width: 220px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 14px; padding: 8px; display: grid; gap: 2px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.share-menu a, .share-menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 10px 12px; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; }
.share-menu a:hover, .share-menu button:hover { background: var(--soft); }
.share-menu i, .share-row i { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; font-style: normal; color: #fff; }
.share-menu i svg, .share-row i svg { width: 16px; height: 16px; fill: currentColor; display: block; }
.share-row { display: flex; flex-wrap: wrap; gap: 8px; }
.share-row a, .share-row button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); border-radius: 100px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
.i-in { background: #0A66C2; } .i-wa { background: #25D366; } .i-x { background: #000; border: 1px solid #333; } .i-mail { background: #6B7280; } .i-link { background: #2B8FFF; }
.share-inline { display: inline-flex; position: relative; }
.share-inline .share-menu { left: 0; right: auto; top: calc(100% + 8px); }
.btn.btn-share { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
.scorebox { display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line-strong); background: var(--card); border-radius: 100px; padding: 4px 18px; }
.scorebox .k { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--meta); }
.scorebox .v { font-family: var(--show); font-weight: 900; font-size: 28px; color: var(--green-text); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; line-height: 1.1; }

main { flex: 1; width: 100%; max-width: 1180px; margin-inline: auto; padding-block: 4px 40px; display: flex; flex-direction: column; gap: 24px; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--meta); }
.lead { font-size: clamp(16px, 1.3vw, 18px); color: var(--slate); max-width: 60ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.note { font-size: 13.5px; color: var(--meta); }
.note.err { color: var(--red-text); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 30px; border-radius: 12px; font-weight: 700; font-size: 17px; line-height: 1.2; border: 1px solid transparent; cursor: pointer; transition: background-color .15s, transform .1s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 0 30px rgba(43,143,255,.35); }
.btn-primary:hover { background: var(--blue-deep); }
.btn-primary:disabled { background: var(--line-strong); color: var(--meta); cursor: not-allowed; box-shadow: none; }
.btn-ghost { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.linkish { background: none; border: 0; padding: 0; color: var(--blue-text); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Première page */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: start; padding-top: 4px; }
.hero h1 { font-family: var(--show); font-weight: 900; text-transform: uppercase; letter-spacing: .005em; font-size: clamp(60px, min(9.4vw, 19vh), 150px); line-height: .9; }
.hero h1 em { display: inline-block; padding-top: .06em; }
.hero h1 em { font-style: normal; color: var(--green); }
.hero .sig { font-family: var(--title); font-weight: 700; font-size: clamp(19px, 1.9vw, 24px); color: var(--ink); letter-spacing: -0.02em; }
.teams { display: grid; gap: 7px; }
.team { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--line-strong); border-radius: 14px; padding: 9px 16px; cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s; }
.team:hover { border-color: var(--blue); }
.team .emo { font-size: 24px; line-height: 1; text-align: center; }
.team .n { font-weight: 700; color: var(--ink); font-size: 16px; }
.team .s { font-size: 13px; color: var(--meta); }
.team .avg { font-family: var(--show); font-weight: 800; font-size: 24px; color: var(--slate); font-variant-numeric: tabular-nums; }
.team .avg small { font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--meta); margin-left: 2px; }
.team[aria-pressed="true"] { border-color: var(--green); background: var(--green-tint); box-shadow: 0 0 28px rgba(0,239,139,.18); }
.team[aria-pressed="true"] .avg { color: var(--green-text); }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; gap: 32px; } }

/* Le plateau */
.play { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; align-items: start; }
.play.with-side { grid-template-columns: 230px minmax(0, 1fr) 290px; }
.ladder { display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.ladder .head { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); padding: 0 12px 8px; }
.rung { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; border: 1px solid transparent; font-size: 14px; font-weight: 600; color: var(--meta); }
.rung .n { font-family: var(--show); font-weight: 800; font-size: 19px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.rung .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rung.now { border-color: var(--blue); background: var(--blue-tint); color: var(--ink); box-shadow: 0 0 22px rgba(43,143,255,.28); }
.rung.good { background: var(--green-tint); color: var(--green-text); }
.rung.mid { background: var(--amber-tint); color: var(--amber-text); }
.rung.bad { background: var(--red-tint); color: var(--red-text); }
.rung.sub { margin-top: 8px; border-top: 1px dashed var(--line-strong); border-radius: 0 0 10px 10px; padding-top: 12px; }
.rung.sub.now { border-radius: 10px; border-top-style: solid; }
.screen { border: 1px solid var(--line-strong); border-radius: 24px; background: linear-gradient(180deg, rgba(43,143,255,.07), transparent 38%), var(--card); padding: clamp(20px, 2.6vw, 32px); display: flex; flex-direction: column; gap: 20px; min-height: 0; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.round { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.round .chip { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #06080C; background: var(--green); border-radius: 100px; padding: 5px 12px; }
.round .q { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--meta); }
.q-title { font-size: clamp(22px, 2.4vw, 30px); }
.asked { font-size: 14.5px; color: var(--meta); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.foot { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: auto; }
.foot .src { flex: 1; min-width: 220px; font-size: 12.5px; color: var(--meta); }
.screen .foot { position: sticky; bottom: 0; background: var(--card); padding-block: 14px; margin: auto -8px -8px; padding-inline: 8px; border-top: 1px solid var(--line); z-index: 2; }
@media (max-width: 860px) { .foot .src { flex-basis: 100%; } }
.side { border-radius: 22px; background: #FFFFFF; color: #3A4250; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; font-size: 16px; line-height: 1.5; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); box-shadow: 0 0 60px rgba(0,239,139,.16); }
.side .mz { color: #0A0A0A; font-size: 26px; }
.side b { color: #0A0A0A; font-weight: 700; }
a.btn, a.btn:hover { text-decoration: none; }
.side .small { font-size: 13px; color: #6B7280; }
.side .ask { font-family: var(--title); font-weight: 700; color: #0A0A0A; font-size: 18px; letter-spacing: -0.02em; line-height: 1.25; }
.side .btn-primary, .cta .btn-primary { background: #007BFF; box-shadow: none; align-self: flex-start; }
@media (max-width: 1140px) { .play.with-side { grid-template-columns: 230px minmax(0, 1fr); } .play.with-side .side { grid-column: 2; position: static; } }
@media (max-width: 860px) {
  .play, .play.with-side { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .play.with-side .side { grid-column: 1; }
  .ladder { flex-direction: row; flex-wrap: wrap; position: static; gap: 4px; }
  .ladder .head { flex-basis: 100%; padding: 0 0 4px; }
  .rung { flex: 1; grid-template-columns: 1fr; padding: 6px 0; justify-items: center; min-width: 26px; }
  .rung .t { display: none; }
  .rung.sub { margin-top: 0; border-top: 0; padding-top: 6px; border-radius: 10px; }
  .side { position: static; }
  .screen { min-height: 0; }
}

/* Réponses en pastilles */
.opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.opts.one { grid-template-columns: 1fr; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--soft); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 9px 22px 9px 9px; min-height: 56px; cursor: pointer; font-weight: 600; color: var(--ink); font-size: 16px; line-height: 1.25; transition: border-color .15s, background-color .15s, box-shadow .15s; }
.opt:hover { border-color: var(--blue); }
.opt .key { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--line-strong); font-family: var(--show); font-size: 20px; font-weight: 800; color: var(--blue-text); }
.opt[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-tint); box-shadow: 0 0 26px rgba(43,143,255,.35); }
.opt[aria-pressed="true"] .key { background: var(--blue); border-color: var(--blue); color: #fff; }
.opt .big { font-family: var(--show); font-weight: 800; font-size: 30px; letter-spacing: .01em; }
.opt:disabled { cursor: default; }

/* Curseur : aucune valeur tant qu'on n'y a pas touché */
.slider { display: flex; flex-direction: column; gap: 16px; padding: 30px 26px 20px; border: 1.5px solid var(--line-strong); border-radius: 20px; background: var(--soft); }
.slider .val { font-family: var(--show); font-weight: 900; font-size: clamp(44px, 7vw, 76px); letter-spacing: .005em; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; min-height: 1em; text-align: center; }
.slider .val.empty { color: var(--line-strong); }
.slider input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; margin: 0; background: transparent; cursor: pointer; }
.slider input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--line-strong); }
.slider input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--line-strong); }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; margin-top: -12px; border-radius: 50%; background: var(--blue); border: 4px solid #fff; box-shadow: 0 0 18px rgba(43,143,255,.6); }
.slider input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--blue); border: 4px solid #fff; }
.slider.untouched input[type=range]::-webkit-slider-thumb { opacity: 0; }
.slider.untouched input[type=range]::-moz-range-thumb { opacity: 0; }
.slider .ends { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--meta); font-variant-numeric: tabular-nums; }
.slider .hint { text-align: center; font-size: 14px; color: var(--meta); }

/* Classement par glisser-déposer */
.order { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.order .lbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--meta); margin-bottom: 8px; }
@media (max-width: 640px) { .order { grid-template-columns: 1fr; } }
.rank { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; }
.slot .num { font-family: var(--show); font-weight: 900; font-size: 28px; color: var(--blue-text); text-align: center; line-height: 1; }
.slot .drop { min-height: 56px; border: 2px dashed var(--line-strong); border-radius: 14px; display: flex; align-items: center; transition: border-color .12s, background-color .12s; }
.slot .drop.over { border-color: var(--blue); background: var(--blue-tint); }
.slot .drop.filled { border-color: transparent; }
.pool { display: flex; flex-direction: column; gap: 8px; min-height: 62px; padding: 10px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
.pool .cardx { width: 100%; }
.pool.over { border-color: var(--blue); }
.pool:empty::after { content: attr(data-empty); font-size: 14px; color: var(--meta); padding: 8px; }
.cardx { display: inline-flex; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 12px 16px; font-weight: 600; color: var(--ink); font-size: 16.5px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.slot .cardx { width: 100%; }
.cardx .grip { margin-left: auto; color: var(--meta); font-size: 17px; line-height: 1; letter-spacing: -2px; }
.cardx.lifted { opacity: .25; }
.cardx.ghost { position: fixed; z-index: 60; pointer-events: none; box-shadow: 0 12px 34px rgba(0,0,0,.5); transform: rotate(-2deg); margin: 0; }
.flag { flex: none; width: 33px; height: 22px; border-radius: 4px; border: 1px solid var(--line-strong); overflow: hidden; display: block; }
.flag svg { display: block; width: 100%; height: 100%; }

/* La réponse, à la place de la question */
.verdict { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 16px; font-weight: 700; font-size: 19px; }
.verdict svg { width: 44px; height: 44px; flex: none; }
.verdict .pts { margin-left: auto; font-family: var(--show); font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
.verdict.good { background: var(--green-tint); color: var(--green-text); }
.verdict.mid { background: var(--amber-tint); color: var(--amber-text); }
.verdict.bad { background: var(--red-tint); color: var(--red-text); }
.answer { font-family: var(--title); font-weight: 700; color: var(--ink); font-size: clamp(22px, 2.4vw, 28px); letter-spacing: -0.025em; line-height: 1.15; text-wrap: balance; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.trio div { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.trio div + div { border-left: 1px solid var(--line); }
.trio .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--meta); }
.trio .v { font-family: var(--show); font-weight: 800; font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.trio .real .v { color: var(--green-text); }
@media (max-width: 560px) { .trio { grid-template-columns: 1fr; } .trio div + div { border-left: 0; border-top: 1px solid var(--line); } }
.others { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; font-size: 14.5px; color: var(--slate); }
.others .track { height: 10px; border-radius: 5px; background: var(--line-soft); overflow: hidden; }
.others .track i { display: block; height: 100%; border-radius: 5px; background: var(--blue); }
.others b { font-family: var(--show); font-weight: 800; font-size: 22px; color: var(--ink); }
.rows { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rows .r { display: flex; align-items: center; gap: 12px; padding: 9px 14px; font-size: 15.5px; color: var(--ink); font-weight: 500; }
.rows .r + .r { border-top: 1px solid var(--line-soft); }
.rows .r .pos { flex: none; width: 16px; color: var(--meta); font-weight: 700; font-size: 14px; }
.rows .r .fig { margin-left: auto; color: var(--slate); font-weight: 600; white-space: nowrap; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.rows .r .you { font-size: 12px; font-weight: 700; border-radius: 100px; padding: 2px 8px; white-space: nowrap; }
.rows .r .you.ok { background: var(--green-tint); color: var(--green-text); }
.rows .r .you.ko { background: var(--red-tint); color: var(--red-text); }
.why { display: grid; grid-template-columns: 30px 1fr; gap: 12px; font-size: 15.5px; color: var(--slate); line-height: 1.55; }
.why .bulb { font-size: 22px; line-height: 1.3; }

/* Résultat */
.final { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.final { gap: 40px; }
.final .scorecard { border: 1px solid var(--line-strong); border-radius: 24px; background: var(--card); padding: 36px; display: flex; flex-direction: column; gap: 22px; }
.gate { gap: 22px; }
.board { display: grid; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.board .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 12px 18px; font-size: 15.5px; color: var(--ink); }
.board .row + .row { border-top: 1px solid var(--line-soft); }
.board .row .rk { font-family: var(--show); font-weight: 800; font-size: 22px; color: var(--meta); }
.board .row .who small { display: block; font-size: 13px; color: var(--meta); }
.board .row .sc { font-family: var(--show); font-weight: 900; font-size: 26px; color: var(--ink); }
.board .row.me { background: var(--green-tint); }
.board .row.me .rk, .board .row.me .sc { color: var(--green-text); }
.board .row.gap { justify-items: center; color: var(--meta); font-size: 13px; padding: 6px; grid-template-columns: 1fr; }
.bigscore { display: flex; align-items: baseline; gap: 12px; }
.bigscore b { font-family: var(--show); font-weight: 900; font-size: clamp(80px, 9vw, 120px); color: var(--green-text); line-height: .85; font-variant-numeric: tabular-nums; }
.bigscore span { font-family: var(--show); font-weight: 800; font-size: 34px; color: var(--meta); }
.ranks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ranks div { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.ranks .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--meta); }
.ranks .v { font-family: var(--show); font-weight: 900; font-size: 34px; color: var(--ink); line-height: 1; }
.ranks .v small { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--meta); margin-left: 4px; }
@media (max-width: 480px) { .ranks { grid-template-columns: 1fr; } }
.gate { border: 1.5px solid var(--green); border-radius: 24px; background: var(--green-tint); padding: 32px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 0 60px rgba(0,239,139,.12); }
.gate h2 { font-size: clamp(24px, 2.6vw, 32px); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.fields label { display: flex; flex-direction: column; min-width: 0; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--slate); }
.fields input { border: 1px solid var(--line-strong); border-radius: 10px; padding: 14px; font-size: 16.5px; color: var(--ink); background: var(--ground); min-width: 0; width: 100%; }
.consent { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; line-height: 1.45; color: var(--slate); cursor: pointer; }
.consent input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--green); cursor: pointer; }
.panel { border: 1px solid var(--line-strong); border-radius: 24px; background: var(--card); padding: 32px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { font-size: clamp(22px, 2.4vw, 28px); }
.fam { display: grid; gap: 12px; }
.fam .line { display: grid; grid-template-columns: 22px 30px minmax(110px, 220px) 1fr 44px; gap: 12px; align-items: center; font-size: 15.5px; }
.fam .line .rk { font-family: var(--show); font-weight: 800; font-size: 20px; color: var(--meta); }
.fam .line .n { color: var(--ink); font-weight: 600; }
.fam .line.me .n::after { content: attr(data-me); color: var(--green-text); }
.fam .track { height: 12px; border-radius: 6px; background: var(--line-soft); overflow: hidden; }
.fam .track i { display: block; height: 100%; border-radius: 6px; background: var(--meta); }
.fam .line.me .track i { background: var(--green); }
.fam .s { text-align: right; font-family: var(--show); font-weight: 800; font-size: 22px; color: var(--ink); }
.cta { background: #FFFFFF; color: #3A4250; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.cta h2 { color: #0A0A0A; font-size: clamp(24px, 2.8vw, 34px); }
.cta .mz { color: #0A0A0A; font-size: 24px; }
.cta p { color: #3A4250; }
.cta .btn-primary { align-self: flex-start; background: #007BFF; box-shadow: none; }
@media (max-width: 900px) { .final { grid-template-columns: 1fr; } .fields { grid-template-columns: 1fr; } .fam .line { grid-template-columns: 20px 26px 1fr 40px; } .fam .track { display: none; } }

@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .28s ease-out; } @keyframes fade { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); } @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); } @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(5px); } 30%, 50%, 70% { transform: translateX(-9px); } 40%, 60% { transform: translateX(9px); } }
  .opt.suspense, .slider.suspense, .rank.suspense { animation: pulse .45s ease-in-out infinite alternate; } @keyframes pulse { from { box-shadow: 0 0 10px rgba(43,143,255,.25); } to { box-shadow: 0 0 38px rgba(43,143,255,.75); } }
  .rank.suspense { border-radius: 14px; }
  #flash.on { animation: flash .5s ease-out; } @keyframes flash { 0% { opacity: .28; } 100% { opacity: 0; } }
}
